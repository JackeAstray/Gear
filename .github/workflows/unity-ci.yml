name: Unity CI

# 说明：
#   - 需要仓库 Secrets: UNITY_LICENSE（GameCI 的 Personal License / Pro 授权文件内容）
#     获取方式见 https://game.ci/docs/github/activation
#   - **没有 UNITY_LICENSE 时，下面所有 Unity 作业都会 skipped**。本机验证请走
#     unity-verify.yml（self-hosted runner，只接受 main push 与手动触发，不接受 PR，
#     也不需要授权文件，跑的就是 Tools/unity-verify.ps1）。
#   - EditMode 测试里已经包含「架构守卫」六个规则 + link.xml 共 7 个用例，所以测试绿灯 = 守卫绿灯，
#     不需要单独一步。
#   - PR 上**无条件执行**的只有 syntax-check（C# 语法）与 guard-only（静态守卫）；两者都不做类型检查。
#     类型/行为验证仍依赖 UNITY_LICENSE 或 main 上的自托管 unity-verify。
#   - WebGL / Windows 构建默认只在手动触发和 main 分支上跑；Android 只在手动触发，
#     避免每个 PR 都烧构建时长。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PROJECT_PATH: Unity/Gear

jobs:
  license-check:
    name: Unity License 配置检查
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: 检查 UNITY_LICENSE
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [ -z "${UNITY_LICENSE}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 UNITY_LICENSE；Unity 测试/构建 jobs 将跳过。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE 已配置。"
          fi

  editmode-tests:
    needs: license-check
    if: needs.license-check.outputs.configured == 'true'
    name: EditMode 测试 + 架构守卫
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: 安装 .NET SDK（覆盖率门槛工具用）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 覆盖率包不常驻 manifest：本机离线打开工程时，manifest 里多一个未缓存包会让
      # Unity 卡在导入/解析。改为仅在 CI 工作区临时注入（CI 有网络），不污染仓库。
      # 启用方式：仓库变量 GEAR_ENABLE_COVERAGE=true。
      - name: 注入覆盖率包（仅 CI 工作区）
        if: ${{ vars.GEAR_ENABLE_COVERAGE == 'true' }}
        run: |
          set -euo pipefail
          python3 - "${{ env.UNITY_PROJECT_PATH }}/Packages/manifest.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              manifest = json.load(f)
          manifest.setdefault('dependencies', {})['com.unity.testtools.codecoverage'] = '1.2.6'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write('\n')
          print('已注入 com.unity.testtools.codecoverage（仅本次 CI 工作区）')
          PY

      - name: 运行 EditMode 测试
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          testMode: editmode
          artifactsPath: editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode 测试
          customParameters: >-
            -nographics
            ${{ vars.GEAR_ENABLE_COVERAGE == 'true' && '-enableCodeCoverage -coverageOptions generateAdditionalMetrics;assemblyFilters:+Gear.*' || '' }}

      - name: 用例数与覆盖率门槛
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          extra=""
          if [ "${{ vars.GEAR_ENABLE_COVERAGE }}" = "true" ]; then
            extra="--require-coverage"
          fi
          dotnet run --project Tools/CoverageGate -- \
            --results editmode-results \
            --baseline Tools/CoverageGate/baseline.json \
            $extra

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: editmode-results
          if-no-files-found: warn

  playmode-tests:
    needs: license-check
    if: needs.license-check.outputs.configured == 'true'
    name: PlayMode 测试
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-PlayMode-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-PlayMode-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 运行 PlayMode 测试
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          testMode: playmode
          artifactsPath: playmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode 测试
          customParameters: -nographics

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: playmode-results
          if-no-files-found: warn

  webgl-build:
    needs: license-check
    name: WebGL 构建
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: needs.license-check.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-WebGL-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-WebGL-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 构建 WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: WebGL
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: warn

  windows-build:
    needs: license-check
    name: Windows 构建
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: needs.license-check.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-Windows-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-Windows-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 构建 Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: build/StandaloneWindows64
          if-no-files-found: warn

  android-build:
    needs: license-check
    name: Android 构建（手动）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: needs.license-check.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-Android-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 构建 Android（debug APK）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: build/Android
          if-no-files-found: warn

  syntax-check:
    name: C# 语法检查（不依赖 Unity）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 检查 C# 语法
        run: dotnet run --project Tools/SyntaxCheck -- Unity/Gear/Assets/Gear

      - name: 检查 Markdown 本地链接
        run: dotnet run --project Tools/DocsCheck -- .

  guard-only:
    name: 架构守卫（不跑 Unity 的快速检查）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缺少 .meta 的源文件
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            if [ ! -f "$f.meta" ]; then
              echo "::error file=$f::缺少 .meta（移动/新建文件时必须一起提交）"
              missing=1
            fi
          done < <(find Unity/Gear/Assets/Gear \( -name '*.cs' -o -name '*.asmdef' \) -type f)
          exit $missing

      - name: 单文件行数（新文件不得超过 600 行）
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd Unity/Gear
          baseline="Assets/Gear/Editor/Toolbox/Guards/file-size-baseline.txt"
          fail=0
          while IFS= read -r f; do
            case "$f" in
              */Plugins/*|*/ThirdParty/*|*/3rd/*|*/GenerateScript/*|*/Examples/*|*/Samples/*) continue ;;
            esac
            # 与 ArchitectureGuard.CheckFileSizes 同口径（File.ReadAllLines 行数）。
            # 不能用 wc -l：末行没有换行符时会少算 1 行，CI 与编辑器守卫会得出不同结论。
            lines=$(awk 'END{print NR}' "$f")
            allowed=$(awk -v p="$f" '$2==p {print $1}' "$baseline")
            if [ -n "$allowed" ]; then
              if [ "$lines" -gt "$allowed" ]; then
                echo "::error file=$f::$lines 行，超过基线 $allowed 行（基线只允许变小）"
                fail=1
              fi
            elif [ "$lines" -gt 600 ]; then
              echo "::error file=$f::$lines 行，超过 600 行且未登记基线"
              fail=1
            fi
          done < <(find Assets/Gear -name '*.cs' -type f)
          exit $fail

      - name: asmdef 依赖方向
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            asmdef="$1"; layer="$2"; shift 2
            [ -f "$asmdef" ] || return 0
            for bad in "$@"; do
              if grep -q "\"$bad\"" "$asmdef"; then
                echo "::error file=$asmdef::$layer 不应引用上层程序集 $bad"
                fail=1
              fi
            done
          }
          base=Unity/Gear/Assets/Gear
          check "$base/Framework/Base/Gear.Base.asmdef" "Gear.Base" Gear.Common Gear.Framework.Modules Gear.Utilities Gear.Framework.Runtime
          check "$base/Common/Gear.Common.asmdef" "Gear.Common" Gear.Framework.Modules Gear.Utilities Gear.Framework.Runtime
          check "$base/Framework/Modules/Gear.Framework.Modules.asmdef" "Gear.Framework.Modules" Gear.Framework.Runtime
          check "$base/Utilities/Gear.Utilities.asmdef" "Gear.Utilities" Gear.Framework.Modules Gear.Framework.Runtime
          check "$base/Framework/Runtime/Gear.Framework.Runtime.asmdef" "Gear.Framework.Runtime" Gear.Framework.Modules Gear.EditorTools Gear.Toolbox.Editor Gear.Tests
          exit $fail

      - name: .Instance 使用点只减不增
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd Unity/Gear
          baseline="Assets/Gear/Editor/Toolbox/Guards/instance-usage-baseline.txt"
          fail=0
          # 口径与 ArchitectureGuard.InstanceCheckExcludedSegments 一致：Tests / Example 不参与。
          # 测试不启动引擎、示例代码本身就是演示，两者继续用 Instance 是刻意保留的（见基线文件注释）。
          # .Instance 计数归零时 grep 返回 1；在 set -euo pipefail 下，`actual=$(grep|wc)` 会让
          # 整个 step 在赋值处静默中止（棘轮打满 = CI 红）。本段临时关闭 pipefail，计数仍由 fail 汇总。
          set +o pipefail
          while read -r name limit; do
            case "$name" in ''|\#*) continue ;; esac
            actual=$(grep -rho --include='*.cs' --exclude-dir=Plugins --exclude-dir=3rd \
                       --exclude-dir=GenerateScript --exclude-dir=Examples --exclude-dir=Samples \
                       --exclude-dir=Tests --exclude-dir=Example \
                       "\\b${name}\\.Instance\\b" Assets/Gear 2>/dev/null | wc -l | tr -d ' \r')
            if [ -z "$actual" ] || [ -z "$limit" ]; then
              echo "::error::基线行解析失败：name=[$name] actual=[$actual] limit=[$limit]"
              fail=1
              continue
            fi
            if [ "$actual" -gt "$limit" ]; then
              echo "::error::$name.Instance 有 $actual 处，超过基线 $limit 处（运行时请改用 Modules.Get<T>()）"
              fail=1
            elif [ "$actual" -lt "$limit" ]; then
              echo "::notice::$name.Instance 已降到 $actual 处（基线 $limit），可下调基线条目"
            fi
          done < <(tr -d '\r' < "$baseline")
          exit $fail

      - name: ICustomSystem 必须声明 ModuleOrder
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cd Unity/Gear
          fail=0
          while IFS= read -r f; do
            case "$f" in */Tests/*|*/Editor/*|*ModuleOrderAttribute.cs) continue ;; esac
            if perl -0777 -ne 'exit(/class\s+\w+\s*:\s*[^{]{0,400}?ICustomSystem/s ? 0 : 1)' "$f"; then
              if ! grep -q '\[ModuleOrder(' "$f"; then
                echo "::error file=$f::实现 ICustomSystem 却没有 [ModuleOrder]，初始化顺序会退化成书写顺序"
                fail=1
              fi
            fi
          done < <(find Assets/Gear -name '*.cs' -type f)
          exit $fail

      - name: 旧命名残留（改名 / 目录归位）
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pattern='\bGear\.(Core|Utils)\b|\bCore/(StartGame|System|Base)\b|\bUtils/(Timer|Http|Network|Util|UI)\b'
          # archive/ 是明确"不再维护"的历史记录；design/ 只在下面两份带历史章节的文档里放行，
          # 其余 design 文档照样检查 —— 早先整目录 exclude 会把新写的过时路径一起藏起来。
          hits=$(grep -rnE "$pattern" \
            --include='*.cs' --include='*.md' --include='*.txt' --include='*.asmdef' --include='*.ps1' \
            --exclude='ArchitectureGuard.cs' \
            --exclude='重构方案.md' --exclude='便捷性与可移植性评估.md' \
            --exclude-dir=.git --exclude-dir=Library --exclude-dir=Plugins --exclude-dir=3rd \
            --exclude-dir=GenerateScript --exclude-dir=Examples --exclude-dir=archive --exclude-dir=Build \
            . 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::发现改名前的旧命名残留（应为 Gear.Framework.Runtime / Framework/Runtime/System 等）"
            exit 1
          fi
          echo "未发现旧命名残留"
